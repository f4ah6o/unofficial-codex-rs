[package]
name = "unofficial-codex-v8-poc"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-v8-poc)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_v8_poc"
path = "src/lib.rs"
doctest = false

[features]
sandbox = ["v8/v8_enable_sandbox"]

[lints]
workspace = true

[dependencies]
v8 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
