[package]
name = "unofficial-codex-file-watcher"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-file-watcher)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_file_watcher"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
notify = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
