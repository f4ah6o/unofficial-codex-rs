[package]
name = "unofficial-codex-state"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-state)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
codex-protocol = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
owo-colors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
codex-git-utils = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
