[package]
name = "unofficial-codex-mcp-test-support"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (mcp_test_support)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-login = { workspace = true }
codex-mcp-server = { workspace = true }
codex-terminal-detection = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
rmcp = { workspace = true }
os_info = { workspace = true }
pretty_assertions = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
] }
wiremock = { workspace = true }
core_test_support = { package = "unofficial-codex-core-test-support", path = "../../../core/tests/common" , version = "2026.8.0"}
shlex = { workspace = true }
