[package]
name = "unofficial-codex-backend-client"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-backend-client)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true

[lib]
name = "codex_backend_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = { workspace = true }
url = { workspace = true }
codex-backend-openapi-models = { package = "unofficial-codex-backend-openapi-models", path = "../codex-backend-openapi-models" , version = "2026.8.0"}
codex-api = { workspace = true }
codex-http-client = { workspace = true }
codex-login = { workspace = true }
codex-model-provider = { workspace = true }
codex-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
