[package]
name = "unofficial-codex-external-agent-sessions"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-external-agent-sessions)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "codex_external_agent_sessions"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
codex-app-server-protocol = { workspace = true }
tempfile = { workspace = true }
