[package]
name = "unofficial-codex-experimental-api-macros"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-experimental-api-macros)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_experimental_api_macros"
proc-macro = true
test = false
doctest = false

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[lints]
workspace = true
