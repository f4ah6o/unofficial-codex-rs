[package]
name = "unofficial-codex-bwrap"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-bwrap)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND LGPL-2.0-or-later"

[[bin]]
name = "bwrap"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
