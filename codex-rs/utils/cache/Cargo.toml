[package]
name = "unofficial-codex-utils-cache"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-cache)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lru = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lib]
name = "codex_utils_cache"
doctest = false
