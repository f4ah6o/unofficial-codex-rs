[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-utils-pty"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-pty)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
portable-pty = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = { workspace = true }
log = { workspace = true }
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "minwinbase",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lib]
name = "codex_utils_pty"
doctest = false
