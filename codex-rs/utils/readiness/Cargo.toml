[package]
name = "unofficial-codex-utils-readiness"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-readiness)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
assert_matches = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
name = "codex_utils_readiness"
doctest = false
