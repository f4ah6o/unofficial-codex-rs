[package]
name = "unofficial-codex-utils-cli"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-cli)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive", "wrap_help"] }
codex-protocol = { workspace = true }
codex-shell-command = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lib]
doctest = false
