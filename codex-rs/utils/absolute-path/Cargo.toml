
[package]
name = "unofficial-codex-utils-absolute-path"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-absolute-path)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dirs = { workspace = true }
dunce = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ts-rs = { workspace = true, features = [
    "serde-json-impl",
    "no-serde-warnings",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "codex_utils_absolute_path"
doctest = false
