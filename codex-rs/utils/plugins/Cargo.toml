
[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-utils-plugins"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-plugins)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[lib]
doctest = false
name = "codex_utils_plugins"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-exec-server = { workspace = true }
codex-login = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
