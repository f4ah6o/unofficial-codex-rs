[package]
name = "unofficial-codex-utils-cargo-bin"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-utils-cargo-bin)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
bazel = ["dep:runfiles"]

[dependencies]
assert_cmd = { workspace = true }
runfiles = { workspace = true, optional = true }
thiserror = { workspace = true }

[lib]
test = false
doctest = false
