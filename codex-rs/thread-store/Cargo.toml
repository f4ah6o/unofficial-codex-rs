[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-thread-store"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-thread-store)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[lib]
name = "codex_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-git-utils = { workspace = true }
codex-protocol = { workspace = true }
codex-rollout = { workspace = true }
codex-state = { workspace = true }
codex-utils-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
