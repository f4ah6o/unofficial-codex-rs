[package]
name = "unofficial-codex-file-system"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-file-system)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lib]
test = false
doctest = false
