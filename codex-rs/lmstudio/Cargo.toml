[package]
name = "unofficial-codex-lmstudio"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-lmstudio)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_lmstudio"
path = "src/lib.rs"
doctest = false


[dependencies]
codex-core = { package = "unofficial-codex-core", path = "../core" , version = "2026.8.0"}
codex-model-provider-info = { package = "unofficial-codex-model-provider-info", path = "../model-provider-info" , version = "2026.8.0"}
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = { version = "0.1.44", features = ["log"] }
which = "8.0"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
