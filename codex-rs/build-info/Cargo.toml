[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-build-info"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-build-info)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[lib]
doctest = false
name = "codex_build_info"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-install-context = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
