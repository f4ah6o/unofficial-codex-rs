[package]
name = "unofficial-codex-install-context"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-install-context)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_install_context"
path = "src/lib.rs"
