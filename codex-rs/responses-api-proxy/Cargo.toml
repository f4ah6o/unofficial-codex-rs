[package]
name = "unofficial-codex-responses-api-proxy"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-responses-api-proxy)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_responses_api_proxy"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-responses-api-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-process-hardening = { workspace = true }
ctor = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tiny_http = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
