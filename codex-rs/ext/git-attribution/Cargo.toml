[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-git-attribution"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-git-attribution)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[lib]
name = "codex_git_attribution"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-backend-client = { workspace = true }
codex-extension-api = { workspace = true }
codex-http-client = { workspace = true }
codex-login = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
