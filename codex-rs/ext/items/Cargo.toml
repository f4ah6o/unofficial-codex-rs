[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-extension-items"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-extension-items)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[lib]
name = "codex_extension_items"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-utils-absolute-path = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
