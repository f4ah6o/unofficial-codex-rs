[package]
name = "unofficial-codex-message-history"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-message-history)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_message_history"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
