[package]
name = "unofficial-codex-realtime-webrtc"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-realtime-webrtc)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_realtime_webrtc"
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
libwebrtc = { version = "0.3.26", git = "https://github.com/juberti-oai/rust-sdks.git", rev = "e2d1d1d230c6fc9df171ccb181423f957bb3c1f0" }

[lints]
workspace = true
