[package]
name = "unofficial-codex-ansi-escape"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-ansi-escape)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_ansi_escape"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ansi-to-tui = { workspace = true }
ratatui = { workspace = true, features = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
tracing = { workspace = true, features = ["log"] }
