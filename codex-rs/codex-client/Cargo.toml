http = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tracing = { workspace = true }

[lints]
workspace = true

[lib]
name = "codex_client"
doctest = false
test = false
