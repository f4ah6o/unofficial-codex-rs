[package]
edition.workspace = true
license.workspace = true
name = "unofficial-codex-client"
description = "Unofficial downstream package of the OpenAI Codex Rust workspace (codex-client)."
repository = "https://github.com/f4ah6o/unofficial-codex-rs"
publish = true
version.workspace = true

[dependencies]
codex-http-client = { workspace = true }
eventsource-stream = { workspace = true }
