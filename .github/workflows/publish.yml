name: Publish unofficial Codex crates

on:
  workflow_dispatch:
  push:
    tags:
      - "unofficial-codex-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Make room for standalone package builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libcap-dev

      - name: Authenticate with crates.io Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish the workspace in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: python3 scripts/publish-workspace.py
