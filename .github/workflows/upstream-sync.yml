name: Sync OpenAI Codex upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout downstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/openai/codex.git refs/heads/main
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_SHA=$upstream_sha" >> "$GITHUB_ENV"

      - name: Replace Rust workspace with upstream
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch codex-rs
          for path in codex-rs LICENSE NOTICE docs/license.md; do
            if git cat-file -e "$UPSTREAM_SHA:$path" 2>/dev/null; then
              git checkout "$UPSTREAM_SHA" -- "$path"
            fi
          done

      - name: Advance downstream version
        run: python3 scripts/bump-downstream-version.py

      - name: Apply crates.io overlay
        run: |
          python3 scripts/apply-downstream-overlay.py --upstream-revision "$UPSTREAM_SHA"
          cargo generate-lockfile --manifest-path codex-rs/Cargo.toml

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: automation/upstream-sync
          delete-branch: true
          commit-message: "chore: sync OpenAI Codex upstream"
          title: "chore: sync OpenAI Codex upstream"
          body: |
            Automated downstream refresh from OpenAI Codex.

            The upstream revision is recorded in UPSTREAM_REVISION.

            The overlay namespaces the Cargo packages as unofficial-codex-*,
            keeps library crate names stable, and adds registry-compatible
            dependency versions.
